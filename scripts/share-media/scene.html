<!doctype html>
<!-- The share scene: rendered at 1200x630 by scripts/make-share-media.mjs.
     Frame 0 is the share image. Every animation repeats evenly in 6 seconds, so the video loops seamlessly. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #FFF8EC; }
  svg { display: block; }
  text { font-family: "Arial Rounded MT Bold", ui-rounded, "SF Pro Rounded", "Nunito", system-ui, sans-serif; fill: #2E2140; }
  .flow { animation: flow 6s linear infinite; }
  .roll { transform-box: fill-box; transform-origin: 50% 100%; animation: wobble 3s ease-in-out infinite; }
  .eyes { transform-box: fill-box; transform-origin: 50% 50%; animation: blink 6s linear infinite; }
  .drifter { animation: drift 6s linear infinite; }
  .drifter .bob { animation: bob 1.5s ease-in-out infinite alternate; }
  .streamer { transform-box: fill-box; transform-origin: 100% 50%; animation: flutter 0.75s ease-in-out infinite alternate; }
  @keyframes flow { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -14; } }
  @keyframes wobble { 0%, 100% { transform: rotate(-2.5deg); } 50% { transform: rotate(2.5deg); } }
  @keyframes blink { 0%, 52%, 56%, 100% { transform: scaleY(1); } 54% { transform: scaleY(0.1); } }
  @keyframes drift { from { transform: translateX(1260px); } to { transform: translateX(-240px); } }
  @keyframes bob { from { transform: translateY(-5px); } to { transform: translateY(5px); } }
  @keyframes flutter { from { transform: scaleY(0.75); } to { transform: scaleY(1.15); } }
</style>
</head>
<body>
<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- A small roll, copied into each .mini below so its streamer animates like everything else -->
    <g id="mini">
      <path class="streamer" d="M118 50 C 100 38, 84 66, 60 54 S 24 42, 4 58 L 4 74 C 24 58, 44 70, 60 68 S 100 56, 118 68 Z" fill="#fff" stroke="#2E2140" stroke-opacity=".5" stroke-width="2"/>
      <rect x="112" y="28" width="38" height="46" rx="5" fill="#fff" stroke="#2E2140" stroke-opacity=".7" stroke-width="3"/>
      <ellipse cx="150" cy="51" rx="11" ry="23" fill="#FFFDF8" stroke="#2E2140" stroke-opacity=".7" stroke-width="3"/>
      <ellipse cx="150" cy="51" rx="4.5" ry="9" fill="#C99A63" stroke="#2E2140" stroke-opacity=".7" stroke-width="2"/>
    </g>
  </defs>

  <!-- Background rolls drifting across the top -->
  <g opacity="0.3">
    <g class="drifter" style="animation-delay: 0s"><g class="bob"><g class="mini" transform="translate(0 18)"></g></g></g>
    <g class="drifter" style="animation-delay: -2s"><g class="bob" style="animation-delay: -0.7s"><g class="mini" transform="translate(0 50) scale(0.8)"></g></g></g>
    <g class="drifter" style="animation-delay: -4s"><g class="bob" style="animation-delay: -1.1s"><g class="mini" transform="translate(0 8)"></g></g></g>
  </g>

  <!-- The paper tail, flowing out of the roll and off the bottom edge -->
  <g>
    <path d="M205 370 C 205 470, 70 480, 110 560 S 360 650, 620 612 S 980 560, 1240 610" fill="none" stroke="#E4D3BC" stroke-width="112"/>
    <path d="M205 370 C 205 470, 70 480, 110 560 S 360 650, 620 612 S 980 560, 1240 610" fill="none" stroke="#FFFFFF" stroke-width="104"/>
    <path class="flow" d="M205 370 C 205 470, 70 480, 110 560 S 360 650, 620 612 S 980 560, 1240 610" pathLength="100" fill="none" stroke="#D9C6AE" stroke-width="104" stroke-dasharray="0.25 6.75"/>
  </g>

  <!-- The mascot -->
  <g class="roll">
    <rect x="110" y="140" width="270" height="226" rx="12" fill="#FFFFFF" stroke="#2E2140" stroke-width="10"/>
    <ellipse cx="380" cy="253" rx="62" ry="113" fill="#FFFDF8" stroke="#2E2140" stroke-width="10"/>
    <ellipse cx="380" cy="253" rx="22" ry="41" fill="#C99A63" stroke="#2E2140" stroke-width="9"/>
    <g class="eyes"><circle cx="185" cy="240" r="13" fill="#2E2140"/><circle cx="280" cy="240" r="13" fill="#2E2140"/></g>
    <ellipse cx="156" cy="280" rx="20" ry="12" fill="#FFB3C7"/>
    <ellipse cx="309" cy="280" rx="20" ry="12" fill="#FFB3C7"/>
    <path d="M204 276 Q 232 306 260 276" fill="none" stroke="#2E2140" stroke-width="10" stroke-linecap="round"/>
    <rect x="160" y="358" width="92" height="16" fill="#FFFFFF"/>
  </g>

  <!-- Words -->
  <text x="520" y="208" font-size="30" style="fill:#6A5D72">Mega, Mega XL, Super Mega, decoded</text>
  <text x="516" y="290" font-size="74">Toilet Paper Math</text>
  <text x="520" y="368" font-size="44">Which pack is actually</text>
  <text x="520" y="424" font-size="44">the better deal?</text>
  <rect x="520" y="456" width="226" height="50" rx="25" fill="#2E2140"/>
  <text x="633" y="489" font-size="24" text-anchor="middle" style="fill:#FFFFFF">toiletpaper.app</text>
</svg>
<script>
  for (const g of document.querySelectorAll(".mini")) g.innerHTML = document.getElementById("mini").innerHTML;
</script>
</body>
</html>
