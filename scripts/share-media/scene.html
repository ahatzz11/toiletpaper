<!doctype html>
<!-- The share scene: rendered at 1200x630 by scripts/make-share-media.mjs.
     Frame 0 is the share image. The background rolls are the site's own (styles.css and
     TPCore.skyRollHTML). Every animation repeats evenly in 8 seconds, so the video loops seamlessly:
     sheets sway every 2 s, spools spin every 4 s, rolls bob every 8 s and cross in 8 s (near ones in 4 s). -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../public/styles.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #FFF8EC; }
  .scene { position: relative; z-index: 1; display: block; }
  text { font-family: "Arial Rounded MT Bold", ui-rounded, "SF Pro Rounded", "Nunito", system-ui, sans-serif; fill: #2E2140; }
  /* A bit stronger than on the site, so the rolls read in a small preview. */
  .drifter.depth-far { opacity: 0.22; }
  .drifter.depth-mid { opacity: 0.28; }
  .drifter.depth-near { opacity: 0.34; }
  .s-flow { animation: s-flow 8s linear infinite; }
  .s-roll { transform-box: fill-box; transform-origin: 50% 100%; animation: s-wobble 4s ease-in-out infinite; }
  .s-eyes { transform-box: fill-box; transform-origin: 50% 50%; animation: s-blink 8s linear infinite; }
  @keyframes s-flow { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -14; } }
  @keyframes s-wobble { 0%, 100% { transform: rotate(-2.5deg); } 50% { transform: rotate(2.5deg); } }
  @keyframes s-blink { 0%, 52%, 56%, 100% { transform: scaleY(1); } 54% { transform: scaleY(0.1); } }
</style>
</head>
<body>
<div class="sky" id="sky"></div>
<svg class="scene" width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">

  <!-- The paper tail, flowing out of the roll and off the bottom edge -->
  <g>
    <path d="M205 370 C 205 470, 70 480, 110 560 S 360 650, 620 612 S 980 560, 1240 610" fill="none" stroke="#E4D3BC" stroke-width="112"/>
    <path d="M205 370 C 205 470, 70 480, 110 560 S 360 650, 620 612 S 980 560, 1240 610" fill="none" stroke="#FFFFFF" stroke-width="104"/>
    <path class="s-flow" d="M205 370 C 205 470, 70 480, 110 560 S 360 650, 620 612 S 980 560, 1240 610" pathLength="100" fill="none" stroke="#D9C6AE" stroke-width="104" stroke-dasharray="0.25 6.75"/>
  </g>

  <!-- The mascot -->
  <g class="s-roll">
    <rect x="110" y="140" width="270" height="226" rx="12" fill="#FFFFFF" stroke="#2E2140" stroke-width="10"/>
    <ellipse cx="380" cy="253" rx="62" ry="113" fill="#FFFDF8" stroke="#2E2140" stroke-width="10"/>
    <ellipse cx="380" cy="253" rx="22" ry="41" fill="#C99A63" stroke="#2E2140" stroke-width="9"/>
    <g class="s-eyes"><circle cx="185" cy="240" r="13" fill="#2E2140"/><circle cx="280" cy="240" r="13" fill="#2E2140"/></g>
    <ellipse cx="156" cy="280" rx="20" ry="12" fill="#FFB3C7"/>
    <ellipse cx="309" cy="280" rx="20" ry="12" fill="#FFB3C7"/>
    <path d="M204 276 Q 232 306 260 276" fill="none" stroke="#2E2140" stroke-width="10" stroke-linecap="round"/>
    <rect x="160" y="358" width="92" height="16" fill="#FFFFFF"/>
  </g>

  <!-- Words -->
  <text x="520" y="208" font-size="30" style="fill:#6A5D72">Mega, Mega XL, Super Mega, decoded</text>
  <text x="516" y="290" font-size="74">Toilet Paper Math</text>
  <text x="520" y="368" font-size="44">Which pack is actually</text>
  <text x="520" y="424" font-size="44">the better deal?</text>
  <rect x="520" y="456" width="226" height="50" rx="25" fill="#2E2140"/>
  <text x="633" y="489" font-size="24" text-anchor="middle" style="fill:#FFFFFF">toiletpaper.app</text>
</svg>
<script src="../../public/data.js"></script>
<script src="../../public/core.js"></script>
<script>
  // Fixed positions and timings (the site picks them at random). Delays only shift the phase.
  document.getElementById("sky").innerHTML = [
    { depth: "far", sheets: 6, top: "2%", duration: 8, delay: 0, bobDelay: -1 },
    { depth: "far", sheets: 6, top: "7%", duration: 8, delay: -4, bobDelay: -5 },
    { depth: "mid", sheets: 7, top: "11%", duration: 8, delay: -2, bobDelay: -3 },
    { depth: "near", sheets: 8, top: "16%", duration: 4, delay: -3, bobDelay: -6 },
  ].map(TPCore.skyRollHTML).join("");
</script>
</body>
</html>
